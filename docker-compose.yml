services:
  redis:
    image: redis:7-alpine
    container_name: btc-monitor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - btc-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: btc-monitor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite:///./data/btc_monitor.db
      - SECRET_KEY=btc-monitor-secret-key-change-in-production
      - DEBUG=false
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - btc-network

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: btc-monitor-frontend-admin
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - btc-network

volumes:
  redis_data:
  backend_data:
  backend_logs:

networks:
  btc-network:
    driver: bridge
